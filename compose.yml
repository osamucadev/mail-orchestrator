services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/mail_orchestrator.db
      GOOGLE_OAUTH_CLIENT_SECRETS_FILE: /app/secrets/credentials.json
      GOOGLE_OAUTH_TOKEN_FILE: /app/secrets/token.json
      GOOGLE_OAUTH_REDIRECT_URI: http://localhost:8000/api/auth/callback
    volumes:
      - ./backend/data:/data
      - ./backend/secrets:/app/secrets
      - ./backend/storage:/app/storage
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
